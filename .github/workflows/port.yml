# Builds the Fabric jar of this port branch on every push (or manually from the Actions tab).
# A release is only published from a manual run with "publish" ticked.
name: Build port (Fabric)

on:
  push:
    branches: [port-26.2, port-26.3]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the jar as a release (tag from hiveko_release)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Check jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -e sources -e dev)
          ls -l build/libs
          unzip -p "$JAR" fabric.mod.json
          unzip -p "$JAR" servercountryflags.mixins.json
          echo "flags: $(unzip -Z1 "$JAR" | grep -c 'textures/gui/flags/')"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: servercountryflags-${{ github.ref_name }}
          path: build/libs/*.jar

      - name: Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(grep '^hiveko_release=' gradle.properties | cut -d= -f2)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          [ -n "$TAG" ] || exit 0
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          JAR=$(ls build/libs/*.jar | grep -v -e sources -e dev)
          gh release create "$TAG" $JAR --target "$GITHUB_SHA" --title "Server Country Flags $TAG" \
            --notes "Unofficial port of [Server Country Flags](https://modrinth.com/mod/server-country-flags) 1.10.4 by Khajiitos (MIT) to Minecraft $MC (Fabric). Source: the ${{ github.ref_name }} branch of this repository. Requires Fabric API; Cloth Config and Mod Menu for the settings screen. Looks up each server's location at ip-api.com."
